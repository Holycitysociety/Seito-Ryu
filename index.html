
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Seitō-ryū Aiki Budō</title>
  <meta name="description" content="Seitō-ryū Aiki Budō">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>

<body>
  <header class="site-header">
    <img
      class="header-blossom"
      src="/assets/cherry_blossom_header.png"
      alt=""
      aria-hidden="true"
    >

    <a class="brand" href="#top">
      <img
        class="mon"
        src="/assets/seito-mon.png"
        alt="Seitō-ryū mon"
      >
      <div class="brand-stack">
        <span class="jp">聖都流合気武道</span>
        <span class="romaji">SEITŌ-RYŪ AIKI BUDŌ</span>
      </div>
    </a>

    <button
      class="menu"
      type="button"
      aria-label="Go to founding lore"
    >
      <span></span>
      <span></span>
      <span></span>
    </button>
  </header>

  <main id="top">
    <section class="hero">
      <div class="hero-poster">
        <img
          class="hero-mon"
          src="/assets/seito-mon.png"
          alt="Seitō-ryū mon"
        >

        <div class="hero-wordmark">
          <div class="hero-title-block" data-title-equalizer>
            <h1 data-title-jp>聖都流合気武道</h1>
            <div class="hero-rule" aria-hidden="true"></div>
            <div class="romaji" data-title-romaji>
              SEITŌ-RYŪ AIKI BUDŌ
            </div>
          </div>

          <div class="hero-mark">
            <img
              src="/assets/seito-mon.png"
              alt=""
              aria-hidden="true"
            >
          </div>
        </div>

        <div class="soryuki">
          <span class="jp">創流期</span>
          <span class="rom">Sōryū-ki</span>
          <span class="en">Formative Period</span>
          <span class="place">
            Charleston, South Carolina · 2026
          </span>
        </div>
      </div>
    </section>

    <div id="sections"></div>

    <footer class="colophon">
      <img
        class="mon"
        src="/assets/seito-mon.png"
        alt=""
        aria-hidden="true"
      >
      <div class="jp">聖都流合気武道</div>
      <div class="romaji">SEITŌ-RYŪ AIKI BUDŌ</div>
      <div class="meta">
        創流期 — Sōryū-ki — Formative Period
      </div>
      <div class="meta">
        Charleston, South Carolina · 2026
      </div>
    </footer>
  </main>

  <script src="content.js"></script>

  <script>
    "use strict";

    const root = document.getElementById("sections");
    const menuButton = document.querySelector(".menu");

    /*
     * Japanese pagination
     *
     * Each vertical text panel:
     * - uses the existing 60svh height limit;
     * - stays inside the Japanese half of the grid;
     * - contains as many columns as actually fit;
     * - sends remaining text into another panel below.
     *
     * Panels have no folio backgrounds, borders or frames.
     */

    const JAPANESE_PANEL_GAP = 24;
    let paginationFrame = null;
    let lastPaginationWidth = 0;

    function normalizeJapaneseText(text) {
      return String(text || "")
        .trim()
        .replace(/\r\n?/g, "\n")
        .replace(/[ \t]+\n/g, "\n")
        .replace(/\n[ \t]+/g, "\n")
        .replace(/\n{3,}/g, "\n\n");
    }

    function createAikiSeal(key) {
      const data = aikiSeals[key];
      if (!data) return null;

      const seal = document.createElement("div");
      seal.className = "aiki-seal";
      seal.dataset.seal = key;
      seal.setAttribute(
        "aria-label",
        `${data.romaji}: ${data.gloss}`
      );

      const jp = document.createElement("span");
      jp.className = "aiki-seal-jp";
      jp.textContent = data.jp;

      const romaji = document.createElement("span");
      romaji.className = "aiki-seal-romaji";
      romaji.textContent = data.romaji;

      const gloss = document.createElement("span");
      gloss.className = "aiki-seal-gloss";
      gloss.textContent = data.gloss;

      seal.append(jp, romaji, gloss);
      return seal;
    }

    function createEnglishEntry(paragraph) {
      const entry = document.createElement("div");
      entry.className = "en-entry";

      if (paragraph.seal) {
        const seal = createAikiSeal(paragraph.seal);

        if (seal) {
          if (paragraph.seal === "KAMAE") {
            seal.classList.add("aiki-seal-first");
          }
          entry.appendChild(seal);
        }
      }

      const p = document.createElement("p");
      if (paragraph.class) {
        p.className = paragraph.class;
      }
      p.textContent = paragraph.text;

      entry.appendChild(p);
      return entry;
    }

    function createJapaneseBlock(text) {
      const block = document.createElement("div");
      block.className = "jp-block";
      block.lang = "ja";
      block.dataset.fullText = normalizeJapaneseText(text);
      block.setAttribute("aria-label", "Japanese text");

      return block;
    }

    function createRevealControl() {
      const wrap = document.createElement("div");
      wrap.className = "aiki-reveal-wrap";

      const button = document.createElement("button");
      button.type = "button";
      button.className = "aiki-reveal-button";
      button.setAttribute("aria-expanded", "false");

      button.innerHTML = `
        <span class="aiki-seal-jp">合気</span>
        <span class="aiki-seal-romaji">AIKI</span>
        <span class="aiki-seal-gloss">TAP TO SEE</span>
      `;

      button.addEventListener("click", () => {
        if (
          document.body.classList.contains(
            "aiki-imprint-revealed"
          )
        ) {
          return;
        }

        document.body.classList.add(
          "aiki-imprint-revealed"
        );

        button.classList.add("is-revealed");
        button.setAttribute("aria-expanded", "true");

        const firstSeal = document.querySelector(
          ".aiki-seal-first"
        );

        if (!firstSeal) return;

        const reducedMotion = window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;

        requestAnimationFrame(() => {
          firstSeal.scrollIntoView({
            behavior: reducedMotion ? "auto" : "smooth",
            block: "start"
          });
        });
      });

      wrap.appendChild(button);
      return wrap;
    }

    function renderSections() {
      if (!root || !Array.isArray(sections)) return;

      const fragment = document.createDocumentFragment();

      sections.forEach((section, index) => {
        const sectionElement = document.createElement("section");
        sectionElement.className = "section";

        if (index === 0) {
          sectionElement.id = "about";
        }

        const title = document.createElement("header");
        title.className = "section-title";

        const mark = document.createElement("div");
        mark.className = "section-mark";

        const markImage = document.createElement("img");
        markImage.src = "/assets/seito-mon.png";
        markImage.alt = "";
        markImage.setAttribute("aria-hidden", "true");

        mark.appendChild(markImage);

        const kicker = document.createElement("div");
        kicker.className = "kicker";
        kicker.textContent = section.jpTitle;

        const sub = document.createElement("div");
        sub.className = "sub";
        sub.textContent = section.enTitle;

        title.append(mark, kicker, sub);

        const bilingual = document.createElement("div");
        bilingual.className = "bilingual-block";

        const japanese = createJapaneseBlock(section.jp);

        const english = document.createElement("div");
        english.className = "en-block";

        section.en.forEach(paragraph => {
          english.appendChild(
            createEnglishEntry(paragraph)
          );
        });

        if (section.revealAikiImprint) {
          english.appendChild(createRevealControl());
        }

        bilingual.append(japanese, english);
        sectionElement.append(title, bilingual);
        fragment.appendChild(sectionElement);
      });

      root.replaceChildren(fragment);
    }

    /*
     * Pagination measurement
     *
     * A hidden probe uses exactly the same text styling,
     * height and width as a real Japanese panel.
     *
     * We test whether the text fits horizontally.
     * The binary search finds the longest prefix that fits.
     */

    function makeMeasurementProbe(width, height) {
      const probe = document.createElement("div");

      probe.className = "jp-page jp-measure";
      probe.style.width = `${width}px`;
      probe.style.height = `${height}px`;
      probe.style.maxHeight = "none";
      probe.style.position = "fixed";
      probe.style.left = "-10000px";
      probe.style.top = "0";
      probe.style.visibility = "hidden";
      probe.style.pointerEvents = "none";
      probe.style.overflow = "hidden";
      probe.style.contain = "none";

      document.body.appendChild(probe);
      return probe;
    }

    function fitsInProbe(probe, text) {
      probe.textContent = text;

      /*
       * scrollWidth detects additional vertical-rl columns
       * extending beyond the panel's available width.
       */
      return (
        probe.scrollWidth <= probe.clientWidth + 1 &&
        probe.scrollHeight <= probe.clientHeight + 1
      );
    }

    function findFittingLength(probe, characters) {
      let low = 0;
      let high = characters.length;

      while (low < high) {
        const middle = Math.ceil((low + high) / 2);

        const candidate = characters
          .slice(0, middle)
          .join("");

        if (fitsInProbe(probe, candidate)) {
          low = middle;
        } else {
          high = middle - 1;
        }
      }

      return low;
    }

    function createJapanesePage(text) {
      const page = document.createElement("div");
      page.className = "jp-page";
      page.textContent = text;
      return page;
    }

    function paginateJapaneseBlock(block) {
      const source = block.dataset.fullText || "";
      block.replaceChildren();

      if (!source) return;

      const width = block.clientWidth;

      if (width <= 0) return;

      const sizingPage = createJapanesePage("");
      block.appendChild(sizingPage);

      const height = sizingPage.clientHeight;

      sizingPage.remove();

      if (height <= 0) return;

      const probe = makeMeasurementProbe(width, height);

      try {
        let remaining = Array.from(source);
        let safety = 0;

        while (remaining.length && safety < 1000) {
          safety++;

          /*
           * Remove only whitespace at the boundary between
           * pages. Do not change the canonical source text.
           */
          while (
            remaining.length &&
            /^[\s]$/.test(remaining[0])
          ) {
            remaining.shift();
          }

          if (!remaining.length) break;

          let count = findFittingLength(
            probe,
            remaining
          );

          /*
           * Always make progress, even if a device has an
           * unusually narrow viewport.
           */
          count = Math.max(1, count);

          /*
           * Prefer a natural Japanese punctuation boundary
           * near the end of a page, when doing so does not
           * waste too much available space.
           */
          if (count < remaining.length && count > 16) {
            const lowerLimit = Math.floor(count * 0.82);

            for (
              let i = count - 1;
              i >= lowerLimit;
              i--
            ) {
              if (
                /[。！？!?」』）)]/.test(remaining[i])
              ) {
                count = i + 1;
                break;
              }
            }
          }

          const pageText = remaining
            .slice(0, count)
            .join("");

          block.appendChild(
            createJapanesePage(pageText)
          );

          remaining = remaining.slice(count);
        }
      } finally {
        probe.remove();
      }
    }

    function paginateAllJapanese() {
      document
        .querySelectorAll(".jp-block")
        .forEach(paginateJapaneseBlock);
    }

    function scheduleJapanesePagination() {
      if (paginationFrame !== null) {
        cancelAnimationFrame(paginationFrame);
      }

      paginationFrame = requestAnimationFrame(() => {
        paginationFrame = null;
        paginateAllJapanese();
      });
    }

    /*
     * Hero title width equalization.
     */

    function equalizeHeroTitle() {
      document
        .querySelectorAll("[data-title-equalizer]")
        .forEach(group => {
          const japanese = group.querySelector(
            "[data-title-jp]"
          );

          const romaji = group.querySelector(
            "[data-title-romaji]"
          );

          if (!japanese || !romaji) return;

          japanese.style.setProperty(
            "--match-extra",
            "0px"
          );

          romaji.style.setProperty(
            "--match-extra",
            "0px"
          );

          const jpWidth =
            japanese.getBoundingClientRect().width;

          const romajiWidth =
            romaji.getBoundingClientRect().width;

          const targetWidth = Math.max(
            jpWidth,
            romajiWidth
          );

          function expandLine(element, currentWidth) {
            if (currentWidth >= targetWidth - 0.5) {
              return;
            }

            const characters = Array.from(
              element.textContent.trim()
            ).length;

            if (characters < 2) return;

            const extra = (
              targetWidth - currentWidth
            ) / (characters - 1);

            element.style.setProperty(
              "--match-extra",
              `${extra}px`
            );
          }

          expandLine(japanese, jpWidth);
          expandLine(romaji, romajiWidth);
        });
    }

    function updateLayout() {
      equalizeHeroTitle();
      scheduleJapanesePagination();
    }

    menuButton?.addEventListener("click", () => {
      const reducedMotion = window.matchMedia(
        "(prefers-reduced-motion: reduce)"
      ).matches;

      document.getElementById("about")
        ?.scrollIntoView({
          behavior: reducedMotion ? "auto" : "smooth",
          block: "start"
        });
    });

    renderSections();

    /*
     * Initial pagination, then remeasure after web fonts
     * become available.
     */
    requestAnimationFrame(updateLayout);

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(updateLayout);
    }

    window.addEventListener(
      "load",
      updateLayout,
      { once: true }
    );

    /*
     * A viewport resize can change both panel width
     * and the 60svh height. Repaginate accordingly.
     */
    let resizeTimeout = null;

    window.addEventListener("resize", () => {
      clearTimeout(resizeTimeout);

      resizeTimeout = setTimeout(() => {
        updateLayout();
      }, 120);
    });

    /*
     * Font-loading events can occur after the first
     * rendering pass on some devices.
     */
    if (document.fonts) {
      document.fonts.addEventListener?.(
        "loadingdone",
        updateLayout
      );
    }
  </script>
</body>
</html>
