<script>

/* =========================================================
   REFERENCES
   ========================================================= */

const root =
  document.getElementById("sections");


const menuButton =
  document.querySelector(".menu");



/* =========================================================
   AIKI SEAL
   ========================================================= */

function createAikiSeal(key){

  const data =
    aikiSeals[key];


  if(!data){
    return null;
  }


  const seal =
    document.createElement("div");


  seal.className =
    "aiki-seal";


  seal.dataset.seal =
    key;


  seal.setAttribute(
    "aria-label",
    `${data.romaji}: ${data.gloss}`
  );


  seal.innerHTML = `

    <span class="aiki-seal-jp">
      ${data.jp}
    </span>

    <span class="aiki-seal-romaji">
      ${data.romaji}
    </span>

    <span class="aiki-seal-gloss">
      ${data.gloss}
    </span>

  `;


  return seal;

}



/* =========================================================
   ENGLISH ENTRY
   ========================================================= */

function createEnglishEntry(paragraph){

  const entry =
    document.createElement("div");


  entry.className =
    "en-entry";


  if(paragraph.seal){

    const seal =
      createAikiSeal(
        paragraph.seal
      );


    if(seal){

      if(
        paragraph.seal ===
        "KAMAE"
      ){

        seal.classList.add(
          "aiki-seal-first"
        );

      }


      entry.appendChild(
        seal
      );

    }

  }


  const p =
    document.createElement("p");


  if(paragraph.class){

    p.className =
      paragraph.class;

  }


  p.textContent =
    paragraph.text;


  entry.appendChild(
    p
  );


  return entry;

}



/* =========================================================
   NORMALIZE JAPANESE TEXT

   The whole Japanese section is treated as one continuous
   text stream.

   Blank-line paragraph divisions are retained as a single
   newline inside that stream.

   They DO NOT automatically create a new folio.
   ========================================================= */

function normalizeJapaneseText(text){

  return text

    .trim()

    .replace(
      /\r\n?/g,
      "\n"
    )

    .replace(
      /[ \t]+\n/g,
      "\n"
    )

    .replace(
      /\n[ \t]+/g,
      "\n"
    )

    .replace(
      /\n{2,}/g,
      "\n"
    );

}



/* =========================================================
   CREATE JAPANESE BLOCK
   ========================================================= */

function createJapaneseBlock(text){

  const block =
    document.createElement("div");


  block.className =
    "jp-block";


  block.lang =
    "ja";


  block._sourceText =
    normalizeJapaneseText(
      text
    );


  return block;

}



/* =========================================================
   DOES A FOLIO FIT?
   ========================================================= */

function folioFits(folio){

  const tolerance =
    1.5;


  return(

    folio.scrollWidth <=
      folio.clientWidth + tolerance

    &&

    folio.scrollHeight <=
      folio.clientHeight + tolerance

  );

}



/* =========================================================
   NATURAL JAPANESE PAGE BREAK

   Prefer:
   1. an existing paragraph break
   2. sentence-ending punctuation
   3. quote-ending punctuation
   4. exact maximum fit
   ========================================================= */

function naturalJapaneseBreak(
  text,
  maximum
){

  if(
    maximum >= text.length
  ){
    return text.length;
  }


  const searchDepth =
    48;


  const minimum =
    Math.max(
      1,
      maximum - searchDepth
    );


  /* -------------------------------------------------------
     EXISTING PARAGRAPH BREAK
     ------------------------------------------------------- */

  for(
    let i = maximum - 1;
    i >= minimum;
    i--
  ){

    if(
      text[i] === "\n"
    ){
      return i + 1;
    }

  }


  /* -------------------------------------------------------
     SENTENCE / QUOTE END
     ------------------------------------------------------- */

  const punctuation = [
    "。",
    "！",
    "？",
    "』",
    "」"
  ];


  for(
    let i = maximum - 1;
    i >= minimum;
    i--
  ){

    if(
      punctuation.includes(
        text[i]
      )
    ){
      return i + 1;
    }

  }


  return maximum;

}



/* =========================================================
   FIND MAXIMUM TEXT THAT FITS ONE FOLIO
   ========================================================= */

function findFittingLength(
  folio,
  text
){

  let low =
    1;


  let high =
    text.length;


  let best =
    1;


  while(
    low <= high
  ){

    const middle =
      Math.floor(
        (low + high) / 2
      );


    folio.textContent =
      text.slice(
        0,
        middle
      );


    if(
      folioFits(folio)
    ){

      best =
        middle;


      low =
        middle + 1;

    }

    else{

      high =
        middle - 1;

    }

  }


  return naturalJapaneseBreak(
    text,
    best
  );

}



/* =========================================================
   PAGINATE ONE JAPANESE SECTION

   The full section fills one 60svh folio.

   Only when that folio is full does the text continue
   into another folio below it.
   ========================================================= */

function paginateJapaneseBlock(block){

  const source =
    block._sourceText;


  if(
    typeof source !== "string"
    ||
    !source.length
  ){
    return;
  }


  block.innerHTML =
    "";


  let remaining =
    source;


  while(
    remaining.length
  ){

    const folio =
      document.createElement(
        "div"
      );


    folio.className =
      "jp-folio";


    block.appendChild(
      folio
    );


    /* -----------------------------------------------------
       TEST ALL REMAINING TEXT
       ----------------------------------------------------- */

    folio.textContent =
      remaining;


    if(
      folioFits(folio)
    ){

      remaining =
        "";

      continue;

    }


    /* -----------------------------------------------------
       FIND MAXIMUM PAGE CONTENT
       ----------------------------------------------------- */

    const fittingLength =
      findFittingLength(
        folio,
        remaining
      );


    let pageText =
      remaining
        .slice(
          0,
          fittingLength
        );


    pageText =
      pageText

        .replace(
          /^\s+/,
          ""
        )

        .replace(
          /\s+$/,
          ""
        );


    folio.textContent =
      pageText;


    remaining =
      remaining

        .slice(
          fittingLength
        )

        .replace(
          /^\s+/,
          ""
        );

  }

}



/* =========================================================
   PAGINATE ALL JAPANESE
   ========================================================= */

function paginateJapanese(){

  document
    .querySelectorAll(
      ".jp-block"
    )
    .forEach(
      block => {

        paginateJapaneseBlock(
          block
        );

      }
    );

}



/* =========================================================
   AIKI REVEAL CONTROL
   ========================================================= */

function createRevealControl(){

  const wrap =
    document.createElement("div");


  wrap.className =
    "aiki-reveal-wrap";


  const button =
    document.createElement("button");


  button.type =
    "button";


  button.className =
    "aiki-reveal-button";


  button.setAttribute(
    "aria-expanded",
    "false"
  );


  button.innerHTML = `

    <span class="aiki-seal-jp">
      合気
    </span>

    <span class="aiki-seal-romaji">
      AIKI
    </span>

    <span class="aiki-seal-gloss">
      SEE THE IMPRINT OF AIKI
    </span>

  `;


  button.addEventListener(
    "click",
    () => {

      if(
        document.body.classList.contains(
          "aiki-imprint-revealed"
        )
      ){
        return;
      }


      document.body.classList.add(
        "aiki-imprint-revealed"
      );


      button.classList.add(
        "is-revealed"
      );


      button.setAttribute(
        "aria-expanded",
        "true"
      );


      const firstSeal =
        document.querySelector(
          ".aiki-seal-first"
        );


      if(!firstSeal){
        return;
      }


      const reducedMotion =
        window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;


      requestAnimationFrame(
        () => {

          firstSeal.scrollIntoView({

            behavior:
              reducedMotion
                ? "auto"
                : "smooth",

            block:
              "start"

          });

        }
      );

    }
  );


  wrap.appendChild(
    button
  );


  return wrap;

}



/* =========================================================
   RENDER STORY
   ========================================================= */

function renderSections(){

  if(
    !root
    ||
    !Array.isArray(sections)
  ){
    return;
  }


  const fragment =
    document.createDocumentFragment();


  sections.forEach(
    (section,index) => {

      /* ---------------------------------------------------
         SECTION
         --------------------------------------------------- */

      const sectionElement =
        document.createElement(
          "section"
        );


      sectionElement.className =
        "section";


      if(index === 0){

        sectionElement.id =
          "about";

      }


      /* ---------------------------------------------------
         HEADING
         --------------------------------------------------- */

      const title =
        document.createElement(
          "header"
        );


      title.className =
        "section-title";


      title.innerHTML = `

        <div class="section-mark">

          <img
            src="/assets/seito-mon.png"
            alt=""
            aria-hidden="true"
          >

        </div>

        <div class="kicker">
          ${section.jpTitle}
        </div>

        <div class="sub">
          ${section.enTitle}
        </div>

      `;


      /* ---------------------------------------------------
         BILINGUAL FIELD
         --------------------------------------------------- */

      const bilingual =
        document.createElement(
          "div"
        );


      bilingual.className =
        "bilingual-block";


      /* ---------------------------------------------------
         JAPANESE
         --------------------------------------------------- */

      const japanese =
        createJapaneseBlock(
          section.jp
        );


      /* ---------------------------------------------------
         ENGLISH
         --------------------------------------------------- */

      const english =
        document.createElement(
          "div"
        );


      english.className =
        "en-block";


      section.en.forEach(
        paragraph => {

          english.appendChild(
            createEnglishEntry(
              paragraph
            )
          );

        }
      );


      /* ---------------------------------------------------
         FINAL AIKI REVEAL
         --------------------------------------------------- */

      if(
        section.revealAikiImprint
      ){

        english.appendChild(
          createRevealControl()
        );

      }


      /* ---------------------------------------------------
         ASSEMBLE
         --------------------------------------------------- */

      bilingual.append(
        japanese,
        english
      );


      sectionElement.append(
        title,
        bilingual
      );


      fragment.appendChild(
        sectionElement
      );

    }
  );


  root.appendChild(
    fragment
  );

}



/* =========================================================
   HEADER BUTTON
   ========================================================= */

menuButton?.addEventListener(
  "click",
  () => {

    document
      .getElementById("about")
      ?.scrollIntoView({

        behavior:
          window.matchMedia(
            "(prefers-reduced-motion: reduce)"
          ).matches
            ? "auto"
            : "smooth",

        block:
          "start"

      });

  }
);



/* =========================================================
   HERO TITLE WIDTH EQUALIZER
   ========================================================= */

function equalizeHeroTitle(){

  document
    .querySelectorAll(
      "[data-title-equalizer]"
    )
    .forEach(
      group => {

        const japanese =
          group.querySelector(
            "[data-title-jp]"
          );


        const romaji =
          group.querySelector(
            "[data-title-romaji]"
          );


        if(
          !japanese
          ||
          !romaji
        ){
          return;
        }


        japanese.style
          .setProperty(
            "--match-extra",
            "0px"
          );


        romaji.style
          .setProperty(
            "--match-extra",
            "0px"
          );


        const jpWidth =
          japanese
            .getBoundingClientRect()
            .width;


        const romajiWidth =
          romaji
            .getBoundingClientRect()
            .width;


        const targetWidth =
          Math.max(
            jpWidth,
            romajiWidth
          );


        function expandLine(
          element,
          currentWidth
        ){

          if(
            currentWidth >=
            targetWidth - .5
          ){
            return;
          }


          const characters =
            Array.from(
              element
                .textContent
                .trim()
            ).length;


          if(
            characters < 2
          ){
            return;
          }


          const extra =
            (
              targetWidth -
              currentWidth
            )
            /
            (
              characters -
              1
            );


          element.style
            .setProperty(
              "--match-extra",
              `${extra}px`
            );

        }


        expandLine(
          japanese,
          jpWidth
        );


        expandLine(
          romaji,
          romajiWidth
        );

      }
    );

}



/* =========================================================
   DEBOUNCE
   ========================================================= */

function debounce(
  callback,
  delay
){

  let timer;


  return function(){

    clearTimeout(
      timer
    );


    timer =
      setTimeout(
        callback,
        delay
      );

  };

}



/* =========================================================
   INITIALIZE
   ========================================================= */

renderSections();


function completeLayout(){

  equalizeHeroTitle();

  paginateJapanese();

}


if(
  document.fonts
  &&
  document.fonts.ready
){

  document.fonts.ready.then(
    () => {

      requestAnimationFrame(
        () => {

          requestAnimationFrame(
            completeLayout
          );

        }
      );

    }
  );

}

else{

  window.addEventListener(
    "load",
    completeLayout,
    { once:true }
  );

}



/* =========================================================
   RESPONSIVE REPAGINATION
   ========================================================= */

const repaginate =
  debounce(
    paginateJapanese,
    150
  );


window.addEventListener(
  "resize",
  repaginate
);


window.addEventListener(
  "orientationchange",
  () => {

    setTimeout(
      paginateJapanese,
      250
    );

  }
);

</script>
