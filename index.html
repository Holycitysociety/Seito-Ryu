<script src="content.js"></script>


<script>

/* =========================================================
   REFERENCES
   ========================================================= */

const root =
  document.getElementById("sections");

const menuButton =
  document.querySelector(".menu");


/* =========================================================
   AIKI SEAL
   ========================================================= */

function createAikiSeal(key){

  const data =
    aikiSeals[key];

  if(!data){
    return null;
  }

  const seal =
    document.createElement("div");

  seal.className =
    "aiki-seal";

  seal.dataset.seal =
    key;

  seal.setAttribute(
    "aria-label",
    `${data.romaji}: ${data.gloss}`
  );

  seal.innerHTML = `

    <span class="aiki-seal-jp">
      ${data.jp}
    </span>

    <span class="aiki-seal-romaji">
      ${data.romaji}
    </span>

    <span class="aiki-seal-gloss">
      ${data.gloss}
    </span>

  `;

  return seal;

}


/* =========================================================
   ENGLISH ENTRY
   ========================================================= */

function createEnglishEntry(paragraph){

  const entry =
    document.createElement("div");

  entry.className =
    "en-entry";

  if(paragraph.seal){

    const seal =
      createAikiSeal(
        paragraph.seal
      );

    if(seal){

      if(
        paragraph.seal ===
        "KAMAE"
      ){

        seal.classList.add(
          "aiki-seal-first"
        );

      }

      entry.appendChild(
        seal
      );

    }

  }

  const p =
    document.createElement("p");

  if(paragraph.class){

    p.className =
      paragraph.class;

  }

  p.textContent =
    paragraph.text;

  entry.appendChild(
    p
  );

  return entry;

}


/* =========================================================
   NORMALIZE JAPANESE TEXT

   Preserve narrative line breaks.
   ========================================================= */

function normalizeJapaneseText(text){

  return String(text || "")

    .trim()

    .replace(
      /\r\n?/g,
      "\n"
    )

    .replace(
      /[ \t]+\n/g,
      "\n"
    )

    .replace(
      /\n[ \t]+/g,
      "\n"
    )

    .replace(
      /\n{2,}/g,
      "\n"
    );

}


/* =========================================================
   JAPANESE BLOCK
   ========================================================= */

function createJapaneseBlock(text){

  const block =
    document.createElement("div");

  block.className =
    "jp-block";

  block.lang =
    "ja";

  block._sourceText =
    normalizeJapaneseText(text);

  return block;

}


/* =========================================================
   CREATE JAPANESE FOLIO

   Fixed height is supplied by styles.css.
   ========================================================= */

function createJapaneseFolio(){

  const folio =
    document.createElement("div");

  folio.className =
    "jp-folio";

  const textNode =
    document.createElement("div");

  textNode.className =
    "jp-folio-text";

  folio.appendChild(
    textNode
  );

  return {
    folio,
    textNode
  };

}


/* =========================================================
   JAPANESE MEASUREMENT PROBE

   The probe is positioned offscreen.

   It uses the same font, vertical writing mode,
   column width, letter spacing, and available height
   as the actual folio.

   Crucially, the probe uses overflow:visible, allowing
   measurement of the full text instead of clipped text.
   ========================================================= */

function createJapaneseProbe(folio){

  const sourceText =
    folio.querySelector(
      ".jp-folio-text"
    );

  const sourceStyle =
    getComputedStyle(sourceText);

  const probe =
    document.createElement("div");

  probe.className =
    "jp-measure-probe";

  probe.lang =
    "ja";

  const rect =
    sourceText.getBoundingClientRect();

  Object.assign(
    probe.style,
    {
      position:"fixed",
      left:"-100000px",
      top:"0",
      visibility:"hidden",
      pointerEvents:"none",
      zIndex:"-1",

      boxSizing:"border-box",

      writingMode:"vertical-rl",
      textOrientation:"mixed",

      whiteSpace:"pre-wrap",

      fontFamily:
        sourceStyle.fontFamily,

      fontSize:
        sourceStyle.fontSize,

      fontWeight:
        sourceStyle.fontWeight,

      fontStyle:
        sourceStyle.fontStyle,

      lineHeight:
        sourceStyle.lineHeight,

      letterSpacing:
        sourceStyle.letterSpacing,

      wordSpacing:
        sourceStyle.wordSpacing,

      overflow:"visible",

      height:
        `${rect.height}px`,

      width:
        `${rect.width}px`,

      maxWidth:"none",

      minWidth:"0",

      padding:"0",

      margin:"0",

      border:"0"
    }
  );

  document.body.appendChild(
    probe
  );

  return probe;

}


/* =========================================================
   MEASURE JAPANESE TEXT

   In vertical-rl, additional columns extend
   horizontally toward the left.

   The probe's scrollWidth detects text requiring
   more columns than the folio permits.
   ========================================================= */

function japaneseTextFits(
  probe,
  text
){

  probe.textContent =
    text;

  const tolerance =
    1.5;

  return (
    probe.scrollWidth <=
      probe.clientWidth + tolerance
    &&
    probe.scrollHeight <=
      probe.clientHeight + tolerance
  );

}


/* =========================================================
   FIND MAXIMUM FITTING LENGTH

   Binary search finds the largest prefix that
   fits inside the fixed-height, eight-column folio.
   ========================================================= */

function findFittingLength(
  probe,
  text
){

  let low =
    0;

  let high =
    text.length;

  let best =
    0;

  while(low <= high){

    const middle =
      Math.floor(
        (low + high) / 2
      );

    const candidate =
      text.slice(
        0,
        middle
      );

    if(
      japaneseTextFits(
        probe,
        candidate
      )
    ){

      best =
        middle;

      low =
        middle + 1;

    }

    else{

      high =
        middle - 1;

    }

  }

  return best;

}


/* =========================================================
   NATURAL BREAK

   Prefer a nearby paragraph or sentence ending,
   but only when doing so does not waste substantial
   folio capacity.

   The maximum search distance is deliberately small.
   ========================================================= */

function naturalJapaneseBreak(
  text,
  maximum
){

  if(
    maximum >= text.length
  ){
    return text.length;
  }

  const searchDepth =
    12;

  const minimum =
    Math.max(
      1,
      maximum - searchDepth
    );

  for(
    let i = maximum - 1;
    i >= minimum;
    i--
  ){

    if(
      text[i] === "\n"
    ){
      return i + 1;
    }

  }

  const punctuation =
    new Set([
      "。",
      "！",
      "？",
      "』",
      "」"
    ]);

  for(
    let i = maximum - 1;
    i >= minimum;
    i--
  ){

    if(
      punctuation.has(
        text[i]
      )
    ){
      return i + 1;
    }

  }

  return maximum;

}


/* =========================================================
   PAGINATE JAPANESE BLOCK

   Every folio retains the original fixed height.

   No folio is contracted.

   Text is measured against the actual available
   column width and vertical height.

   The next folio is created only when necessary.
   ========================================================= */

function paginateJapaneseBlock(block){

  const source =
    block._sourceText;

  if(
    typeof source !== "string"
    ||
    !source.length
  ){
    block.replaceChildren();
    return;
  }

  block.replaceChildren();

  let remaining =
    source;

  let pageCount =
    0;

  while(
    remaining.length
  ){

    pageCount++;

    if(
      pageCount > 1000
    ){

      console.warn(
        "Japanese pagination stopped after 1000 folios."
      );

      break;

    }

    const {
      folio,
      textNode
    } =
      createJapaneseFolio();

    block.appendChild(
      folio
    );

    const probe =
      createJapaneseProbe(
        folio
      );

    try{

      if(
        japaneseTextFits(
          probe,
          remaining
        )
      ){

        textNode.textContent =
          remaining;

        remaining =
          "";

        continue;

      }

      const maximum =
        findFittingLength(
          probe,
          remaining
        );

      if(
        maximum < 1
      ){

        console.warn(
          "Japanese folio has insufficient capacity.",
          block
        );

        textNode.textContent =
          remaining;

        break;

      }

      const fittingLength =
        naturalJapaneseBreak(
          remaining,
          maximum
        );

      const pageText =
        remaining
          .slice(
            0,
            fittingLength
          )
          .trim();

      textNode.textContent =
        pageText;

      remaining =
        remaining
          .slice(
            fittingLength
          )
          .trimStart();

    }

    finally{

      probe.remove();

    }

  }

}


/* =========================================================
   PAGINATE ALL JAPANESE
   ========================================================= */

function paginateJapanese(){

  document
    .querySelectorAll(
      ".jp-block"
    )
    .forEach(
      block => {

        paginateJapaneseBlock(
          block
        );

      }
    );

}


/* =========================================================
   AIKI REVEAL
   ========================================================= */

function createRevealControl(){

  const wrap =
    document.createElement(
      "div"
    );

  wrap.className =
    "aiki-reveal-wrap";

  const button =
    document.createElement(
      "button"
    );

  button.type =
    "button";

  button.className =
    "aiki-reveal-button";

  button.setAttribute(
    "aria-expanded",
    "false"
  );

  button.innerHTML = `

    <span class="aiki-seal-jp">
      合気
    </span>

    <span class="aiki-seal-romaji">
      AIKI
    </span>

    <span class="aiki-seal-gloss">
      TAP TO SEE
    </span>

  `;

  button.addEventListener(
    "click",
    () => {

      if(
        document.body.classList.contains(
          "aiki-imprint-revealed"
        )
      ){
        return;
      }

      document.body.classList.add(
        "aiki-imprint-revealed"
      );

      button.classList.add(
        "is-revealed"
      );

      button.setAttribute(
        "aria-expanded",
        "true"
      );

      const firstSeal =
        document.querySelector(
          ".aiki-seal-first"
        );

      if(!firstSeal){
        return;
      }

      const reducedMotion =
        window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;

      requestAnimationFrame(
        () => {

          firstSeal.scrollIntoView({

            behavior:
              reducedMotion
                ? "auto"
                : "smooth",

            block:
              "start"

          });

        }
      );

    }
  );

  wrap.appendChild(
    button
  );

  return wrap;

}


/* =========================================================
   RENDER STORY
   ========================================================= */

function renderSections(){

  if(
    !root
    ||
    !Array.isArray(sections)
  ){
    return;
  }

  const fragment =
    document.createDocumentFragment();

  sections.forEach(
    (section,index) => {

      const sectionElement =
        document.createElement(
          "section"
        );

      sectionElement.className =
        "section";

      if(index === 0){

        sectionElement.id =
          "about";

      }

      /* ---------------------------------------------------
         SECTION TITLE
         --------------------------------------------------- */

      const title =
        document.createElement(
          "header"
        );

      title.className =
        "section-title";

      title.innerHTML = `

        <div class="section-mark">

          <img
            src="/assets/seito-mon.png"
            alt=""
            aria-hidden="true"
          >

        </div>

        <div class="kicker">
          ${section.jpTitle}
        </div>

        <div class="sub">
          ${section.enTitle}
        </div>

      `;

      /* ---------------------------------------------------
         BILINGUAL FIELD
         --------------------------------------------------- */

      const bilingual =
        document.createElement(
          "div"
        );

      bilingual.className =
        "bilingual-block";

      /* ---------------------------------------------------
         JAPANESE
         --------------------------------------------------- */

      const japanese =
        createJapaneseBlock(
          section.jp
        );

      /* ---------------------------------------------------
         ENGLISH
         --------------------------------------------------- */

      const english =
        document.createElement(
          "div"
        );

      english.className =
        "en-block";

      section.en.forEach(
        paragraph => {

          english.appendChild(
            createEnglishEntry(
              paragraph
            )
          );

        }
      );

      /* ---------------------------------------------------
         FINAL REVEAL
         --------------------------------------------------- */

      if(
        section.revealAikiImprint
      ){

        english.appendChild(
          createRevealControl()
        );

      }

      bilingual.append(
        japanese,
        english
      );

      sectionElement.append(
        title,
        bilingual
      );

      fragment.appendChild(
        sectionElement
      );

    }
  );

  root.replaceChildren(
    fragment
  );

}


/* =========================================================
   HEADER BUTTON
   ========================================================= */

menuButton?.addEventListener(
  "click",
  () => {

    document
      .getElementById("about")
      ?.scrollIntoView({

        behavior:
          window.matchMedia(
            "(prefers-reduced-motion: reduce)"
          ).matches
            ? "auto"
            : "smooth",

        block:
          "start"

      });

  }
);


/* =========================================================
   HERO TITLE WIDTH EQUALIZER
   ========================================================= */

function equalizeHeroTitle(){

  document
    .querySelectorAll(
      "[data-title-equalizer]"
    )
    .forEach(
      group => {

        const japanese =
          group.querySelector(
            "[data-title-jp]"
          );

        const romaji =
          group.querySelector(
            "[data-title-romaji]"
          );

        if(
          !japanese
          ||
          !romaji
        ){
          return;
        }

        japanese.style
          .setProperty(
            "--match-extra",
            "0px"
          );

        romaji.style
          .setProperty(
            "--match-extra",
            "0px"
          );

        const jpWidth =
          japanese
            .getBoundingClientRect()
            .width;

        const romajiWidth =
          romaji
            .getBoundingClientRect()
            .width;

        const targetWidth =
          Math.max(
            jpWidth,
            romajiWidth
          );

        function expandLine(
          element,
          currentWidth
        ){

          if(
            currentWidth >=
            targetWidth - .5
          ){
            return;
          }

          const characters =
            Array.from(
              element
                .textContent
                .trim()
            ).length;

          if(
            characters < 2
          ){
            return;
          }

          const extra =
            (
              targetWidth -
              currentWidth
            )
            /
            (
              characters -
              1
            );

          element.style
            .setProperty(
              "--match-extra",
              `${extra}px`
            );

        }

        expandLine(
          japanese,
          jpWidth
        );

        expandLine(
          romaji,
          romajiWidth
        );

      }
    );

}


/* =========================================================
   DEBOUNCE
   ========================================================= */

function debounce(
  callback,
  delay
){

  let timer;

  return function(){

    clearTimeout(
      timer
    );

    timer =
      setTimeout(
        callback,
        delay
      );

  };

}


/* =========================================================
   INITIALIZE
   ========================================================= */

renderSections();


function completeLayout(){

  equalizeHeroTitle();

  paginateJapanese();

}


if(
  document.fonts
  &&
  document.fonts.ready
){

  document.fonts.ready.then(
    () => {

      requestAnimationFrame(
        () => {

          requestAnimationFrame(
            completeLayout
          );

        }
      );

    }
  );

}

else{

  window.addEventListener(
    "load",
    completeLayout,
    { once:true }
  );

}


/* =========================================================
   RESPONSIVE REPAGINATION
   ========================================================= */

const repaginate =
  debounce(
    completeLayout,
    150
  );


window.addEventListener(
  "resize",
  repaginate
);


window.addEventListener(
  "orientationchange",
  () => {

    setTimeout(
      completeLayout,
      250
    );

  }
);

</script>
