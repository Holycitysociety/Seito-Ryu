  <!-- EMBEDDED SITE STYLES -->
  <style>
:root{
  /* COLOR */
  --paper:#e8d7c7;
  --folio:#f2e7db;
  --ink:#171411;
  --muted:#6b645d;
  --shu:#b02a20;

  /* FONT FAMILIES */

    "Yuji Syuku",
    "Hiragino Mincho ProN",
    "Yu Mincho",
    "YuMincho",
    "Noto Serif JP",
    serif;
  --jp-body:

    "Yu Mincho",
    "YuMincho",
    "Noto Serif JP",
    serif;

  /* MOBILE HEADER */
  --header-h:58px;

  /* READER */
  --reader-max:940px;
  --jp-size:16.5px;
  --jp-leading:1.68;
  --en-size:18.2px;
  --en-leading:1.44;
  --pair-gap:14px;
  --folio-pad-x:12px;
  --folio-pad-y:18px;
  --paragraph-gap:30px;
  --section-pad-x:18px;

  /* HERO â€” MOBILE */
  --hero-pad-top:34px;
  --hero-pad-bottom:38px;
  --hero-poster-max:640px;
  --hero-mon-w:min(84vw,360px);
  --hero-wordmark-lift:-78px;
  --hero-title-size:clamp(36.8px,8.96vw,60.8px);
  --hero-title-line:1.05;
  --hero-title-track:.03em;
  --hero-rule-w:88px;
  --hero-rule-h:2px;
  --hero-rule-gap-top:10px;
  --hero-rule-gap-bottom:12px;
  --hero-romaji-size:clamp(15.2px,4.08vw,24.8px);
  --hero-romaji-line:1.15;
  --hero-romaji-track:.12em;
  --hero-mark-gap-top:24px;
  --hero-mark-gap-bottom:32px;
  --hero-mark-size:32px;
  --hero-soryuki-jp:clamp(14.4px,4.64vw,27.2px);
  --hero-soryuki-sub:clamp(12.8px,3.92vw,22.4px);
  --hero-place-size:clamp(11.2px,3.52vw,17.6px);
}

/* RESET */
*{
  box-sizing:border-box;
}

html{
  scroll-behavior:smooth;
}

body{
  margin:0;
  color:var(--ink);
  background:var(--paper);
  font-family:
    "Bodoni 72",
    "Bodoni 72 Smallcaps",
    "Baskerville",
    "Iowan Old Style",
    "Times New Roman",
    serif;
  line-height:1.48;
}

img{
  display:block;
  max-width:100%;
}

main{
  overflow:hidden;
}

/* HEADER â€” MOBILE */
.site-header{
  position:sticky;
  top:0;
  z-index:100;
  height:var(--header-h);
  min-height:var(--header-h);
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  padding:
    0
    14px
    0
    max(12px,env(safe-area-inset-left));
  background:var(--paper);
  border-bottom:1px solid rgba(0,0,0,.08);
  box-shadow:0 4px 14px rgba(0,0,0,.045);
  overflow:visible;
  isolation:isolate;
}

/* FLOATING CHERRY BLOSSOM */
.header-blossom{
  position:absolute;
  z-index:0;
  left:-18px;
  top:-50px;
  width:314px;
  height:auto;
  max-width:none;
  opacity:1;
  pointer-events:none;
  user-select:none;
}

/* HEADER IDENTITY */
.brand{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  gap:10px;
  min-width:0;
  margin-left:56px;
  color:inherit;
  text-decoration:none;
}

.brand .mon{
  width:64px;
  height:auto;
  flex:0 0 auto;
  opacity:1;
  transform:translateX(7px);
}

.brand-stack{
  min-width:0;
  line-height:1;
  opacity:1;
}

.brand-stack .jp{
  display:block;
  margin-bottom:5px;
  font-family:var(--brush);
  font-weight:400;
  font-size:20px;
  line-height:1.05;
  letter-spacing:.045em;
  white-space:nowrap;
}

.brand-stack .romaji{
  display:block;
  font-size:11.5px;
  line-height:1;
  letter-spacing:.065em;
  white-space:nowrap;
}

/* MENU */
.menu{
  position:relative;
  z-index:3;
  width:40px;
  height:40px;
  flex:0 0 auto;
  border:2px solid var(--shu);
  border-radius:2px;
  background:var(--paper);
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:4px;
  cursor:pointer;
}

.menu span{
  width:20px;
  height:3px;
  display:block;
  background:var(--shu);
  border-radius:1px;
}

/* NARROW PHONE */
@media(max-width:390px){
  .brand{

  }

}

/* HERO */
.hero{
  min-height:calc(100svh - var(--header-h));
  display:grid;
  align-content:center;
  justify-items:center;
  padding:
    var(--hero-pad-top)
    18px
    var(--hero-pad-bottom);
  text-align:center;
}

.hero-poster{
  width:min(100%,var(--hero-poster-max));
  display:grid;
  justify-items:center;
  align-content:start;
}

/* LARGE HERO MON */
.hero-mon{
  width:var(--hero-mon-w);
  margin:0;
}

/* HERO WORDMARK */
.hero-wordmark{
  display:grid;
  justify-items:center;
  width:max-content;
  max-width:100%;
  margin-top:var(--hero-wordmark-lift);
}

.hero-title-block{
  width:max-content;
  max-width:100%;
  display:grid;
  justify-items:center;
}

/* HERO BRUSH TITLE */
.hero h1{
  --match-extra:0px;
  margin:0;
  width:max-content;
  max-width:100%;
  font-family:var(--brush);
  font-weight:400;
  font-size:var(--hero-title-size);
  line-height:var(--hero-title-line);
  letter-spacing:calc(
    var(--hero-title-track) + var(--match-extra)
  );
  white-space:nowrap;
}

.hero-rule{
  width:var(--hero-rule-w);
  height:var(--hero-rule-h);
  margin-top:var(--hero-rule-gap-top);
  margin-bottom:var(--hero-rule-gap-bottom);
  background:rgba(176,42,32,.72);
}

.hero .romaji{
  --match-extra:0px;

  max-width:100%;

  line-height:var(--hero-romaji-line);
  letter-spacing:calc(
    var(--hero-romaji-track) + var(--match-extra)
  );
  white-space:nowrap;
}

/* WORDMARK MON */
.hero-mark{
  margin:
    var(--hero-mark-gap-top)
    auto
    var(--hero-mark-gap-bottom);
  display:flex;
  align-items:center;
  justify-content:center;
}

.hero-mark img{
  width:var(--hero-mark-size);
  height:auto;
}

/* SORYU-KI */
.soryuki{
  line-height:1.24;
  margin-bottom:20px;
}

.soryuki span{
  display:block;
}

.soryuki .jp{
  font-family:var(--brush);
  font-weight:400;
  font-size:var(--hero-soryuki-jp);

}

.soryuki .rom,

}

.soryuki .place{
  margin-top:10px;
  font-size:var(--hero-place-size);
}

/* SECTIONS */
.section{
  width:min(100%,var(--reader-max));
  margin:0 auto;
  padding:48px var(--section-pad-x) 72px;
}

.section-title{
  text-align:center;
  margin-bottom:32px;
}

/* SECTION BRUSH TITLES */
.section-title .kicker{
  font-family:var(--brush);
  font-size:clamp(21px,5.4vw,32px);
  font-weight:400;
  line-height:1.15;
  letter-spacing:.055em;
}

.section-title .sub{
  margin-top:8px;
  font-size:clamp(13px,3.8vw,17px);
  font-weight:600;
  letter-spacing:.08em;
}

/* SECTION MON */
.section-mark{
  margin:0 auto 28px;
  display:flex;
  align-items:center;
  justify-content:center;
}

.section-mark img{
  width:24px;
  height:auto;
}

/* CONTINUOUS BILINGUAL FIELD */
.section-body{
  position:relative;
  width:100%;
  display:grid;
  grid-template-columns:minmax(0,1fr) minmax(0,1fr);
  column-gap:var(--pair-gap);
  row-gap:var(--paragraph-gap);
  align-items:start;
  padding-top:var(--folio-pad-y);
  padding-bottom:var(--folio-pad-y);
}

/* CONTINUOUS JAPANESE FOLIO */
.section-body::before{
  content:"";
  position:absolute;
  z-index:0;
  top:0;
  bottom:0;
  right:calc(50% + (var(--pair-gap) / 2));
  width:min(
    17rem,
    calc((100% - var(--pair-gap)) / 2)
  );
  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.34),
      transparent 36%
    ),
    repeating-linear-gradient(
      0deg,
      rgba(85,65,45,.012) 0 1px,
      transparent 1px 4px
    ),
    var(--folio);
  border:1px solid rgba(72,52,37,.13);
  border-radius:2px;
  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.50),
    0 1px 2px rgba(74,45,25,.055),
    0 8px 20px rgba(74,45,25,.085);
  pointer-events:none;
}

/* JAPANESE BODY TEXT */
.jp-paragraph{
  position:relative;
  z-index:1;
  grid-column:1;
  width:min(17rem,100%);
  justify-self:end;
  padding-left:var(--folio-pad-x);
  padding-right:var(--folio-pad-x);
  writing-mode:vertical-rl;
  text-orientation:mixed;
  overflow:hidden;
  font-family:var(--jp-body);
  font-size:var(--jp-size);
  line-height:var(--jp-leading);
  letter-spacing:.14em;
}

/* ENGLISH TEXT */
.en-group{
  position:relative;
  z-index:1;
  grid-column:2;
  min-width:0;
  font-size:var(--en-size);
  font-weight:500;
  line-height:var(--en-leading);
  letter-spacing:.015em;
  font-kerning:normal;
  overflow-wrap:anywhere;
}

.en-group p{
  margin:0 0 1.38em;
  text-align:left;
  hyphens:auto;
  -webkit-hyphens:auto;
  word-spacing:.08em;
}

.en-group p:last-child{
  margin-bottom:0;
}

.en-group .sequence{
  font-size:.92em;
  line-height:1.75;
  letter-spacing:.05em;
  text-align:left;
}

.en-group .closing{
  font-size:1.34em;
  line-height:1.25;
  text-align:left;
}

  <script>
    /* RENDER NON-HERO CONTENT */
    const root = document.getElementById("sections");

    sections.forEach((section, index) => {
      const sectionElement = document.createElement("section");
      sectionElement.className = "section";

      if (index === 0) {
        sectionElement.id = "about";
      }

      sectionElement.innerHTML = `
        <div class="section-title">
          <div class="section-mark">
            <img src="/assets/seito-mon.png" alt="">
          </div>
          <div class="kicker">${section.jpTitle}</div>
          <div class="sub">${section.enTitle}</div>
        </div>
        <div class="section-body"></div>
      `;

      const body = sectionElement.querySelector(".section-body");

      section.rows.forEach((row, rowIndex) => {
        const jp = document.createElement("div");
        jp.className = "jp-paragraph";
        jp.lang = "ja";
        jp.textContent = row.jp;

        const en = document.createElement("div");
        en.className = "en-group";

        row.en.forEach((paragraph) => {
          const node = document.createElement("p");

          if (paragraph.class) {
            node.className = paragraph.class;
          }

          node.textContent = paragraph.text;
          en.appendChild(node);
        });

        const gridRow = rowIndex + 1;
        jp.style.gridRow = gridRow;
        en.style.gridRow = gridRow;
        body.append(jp, en);
      });

      root.appendChild(sectionElement);
    });

    /* HERO TITLE WIDTH EQUALIZER */
    function equalizeHeroTitle() {
      document.querySelectorAll("[data-title-equalizer]").forEach((group) => {
        const japanese = group.querySelector("[data-title-jp]");
        const romaji = group.querySelector("[data-title-romaji]");

        if (!japanese || !romaji) {
          return;
        }

        japanese.style.setProperty("--match-extra", "0px");
        romaji.style.setProperty("--match-extra", "0px");

        const jpWidth = japanese.getBoundingClientRect().width;
        const romajiWidth = romaji.getBoundingClientRect().width;
        const targetWidth = Math.max(jpWidth, romajiWidth);

        function expandLine(element, currentWidth) {
          if (currentWidth >= targetWidth - .5) {
            return;
          }

          const characters = Array.from(element.textContent.trim()).length;

          if (characters < 2) {
            return;
          }

          const extra = (targetWidth - currentWidth) / (characters - 1);
          element.style.setProperty("--match-extra", `${extra}px`);
        }

        expandLine(japanese, jpWidth);
        expandLine(romaji, romajiWidth);
      });
    }

    /* JAPANESE VERTICAL FITTING */
    function paragraphFits(paragraph) {
      const tolerance = 1.5;

      return (
        paragraph.scrollWidth <= paragraph.clientWidth + tolerance &&
        paragraph.scrollHeight <= paragraph.clientHeight + tolerance
      );
    }

    function fitVerticalParagraph(paragraph) {
      const minimum = window.innerWidth >= 760 ? 220 : 200;
      let low = minimum;
      let high = minimum;

      paragraph.style.height = `${high}px`;

      while (!paragraphFits(paragraph) && high < 1800) {
        high += 60;
        paragraph.style.height = `${high}px`;
      }

      while (low < high) {
        const middle = Math.floor((low + high) / 2);
        paragraph.style.height = `${middle}px`;

        if (paragraphFits(paragraph)) {
          high = middle;
        } else {
          low = middle + 1;
        }
      }

      const fontSize = parseFloat(getComputedStyle(paragraph).fontSize);
      const breathingRoom = Math.max(10, fontSize * .55);

      paragraph.style.height = `${Math.ceil(high + breathingRoom)}px`;
    }

    /* COMPLETE PAGE LAYOUT */
    function layoutPage() {
      equalizeHeroTitle();

      document.querySelectorAll(".jp-paragraph").forEach((paragraph) => {
        fitVerticalParagraph(paragraph);
      });
    }

    /* DEBOUNCE */
    function debounce(callback, delay) {
      let timer;

      return function() {
        clearTimeout(timer);
        timer = setTimeout(callback, delay);
      };
    }

    /* INITIAL LAYOUT */
    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => {
        requestAnimationFrame(() => {
          requestAnimationFrame(layoutPage);
        });
      });
    } else {
      window.addEventListener("load", layoutPage);
    }

    /* RESPONSIVE RECALCULATION */
    const relayout = debounce(layoutPage, 120);

    window.addEventListener("resize", relayout);

    window.addEventListener("orientationchange", () => {
      setTimeout(layoutPage, 250);
    });

    if (window.visualViewport) {
      window.visualViewport.addEventListener("resize", relayout);
    }
  </script>
