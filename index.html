<!doctype html>
<html lang="en">
 
<head>
 
<meta charset="utf-8">
 
<meta
 name="viewport"
 content="width=device-width, initial-scale=1, viewport-fit=cover"
>

<meta

 content="Seito-ryū Aiki Budō"
>
 
 
<!-- =======================================================
    DISPLAY BRUSH FONT

<link
 rel="preconnect"
 href="https://fonts.googleapis.com"
>
 
<link
 rel="preconnect"
 href="https://fonts.gstatic.com"
 crossorigin
>
 
<link
 href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap"
 rel="stylesheet"
>
 
 
<!-- =======================================================
    SITE STYLES
    ======================================================= -->
 
<link
 rel="stylesheet"
 href="styles.css"
>
 
</head>
 
 
<body>
 
 
<!-- =======================================================
    HEADER
    ======================================================= -->
 
<header class="site-header">
 
 <img
   class="header-blossom"
   src="/assets/cherry_blossom_header.png"
   alt=""
   aria-hidden="true"
 >
 
 
 <a
   class="brand"
   href="#top"
 >
 
   <img
     class="mon"
     src="/assets/seito-mon.png"
     alt="Seito-ryū mon"
   >
 
 
   <div class="brand-stack">
 
     <span class="jp">
       聖都流合気武道
     </span>
 
     <span class="romaji">
       SEITO-RYŪ AIKI BUDŌ
     </span>
 
   </div>
 
 </a>
 
 
 <button
   class="menu"
   aria-label="Go to About"
   onclick="
     document
       .getElementById('about')
       .scrollIntoView({
         behavior:'smooth'
       })
   "
 >
 
   <span></span>
   <span></span>
   <span></span>
 
 </button>
 
</header>
 
 
 
<!-- =======================================================
    MAIN
    ======================================================= -->
 
<main id="top">
 
 
<!-- =======================================================
    HERO
 
    HERO CONTENT STAYS HERE.
    NORMAL PAGE TEXT LIVES IN content.js
    ======================================================= -->
 
<section class="hero">
 
 <div class="hero-poster">
 
   <img
     class="hero-mon"
     src="/assets/seito-mon.png"
     alt="Seito-ryū mon"
   >
 
 
   <div class="hero-wordmark">
 
     <div
       class="hero-title-block"
       data-title-equalizer
     >
 
       <h1 data-title-jp>
         聖都流合気武道
       </h1>
 
 
       <div
         class="hero-rule"
         aria-hidden="true"
       ></div>
 
 
       <div
         class="romaji"
         data-title-romaji
       >
         SEITO-RYŪ AIKI BUDŌ
       </div>
 
     </div>
 
 
     <div class="hero-mark">
 
       <img
         src="/assets/seito-mon.png"
         alt=""
       >
 
     </div>
 
   </div>
 
 
   <div class="soryuki">
 
     <span class="jp">
       創流期
     </span>
 
     <span class="rom">
       Sōryū-ki
     </span>
 
     <span class="en">
       Formative Period
     </span>
 
     <span class="place">
       Charleston, South Carolina · 2026
     </span>
 
   </div>
 
 </div>
 
</section>
 
 
 
<!-- =======================================================
    NON-HERO CONTENT IS INSERTED HERE
    ======================================================= -->
 
<div id="sections"></div>
 
 
 
<!-- =======================================================
    FOOTER
    ======================================================= -->
 
<footer class="colophon">
 
 <img
   class="mon"
   src="/assets/seito-mon.png"
   alt=""
 >
 
 <div class="jp">
   聖都流合気武道
 </div>
 
 <div class="romaji">
   SEITO-RYŪ AIKI BUDŌ
 </div>
 
 <div class="meta">
   創流期 — Sōryū-ki — Formative Period
 </div>
 
 <div class="meta">
   Charleston, South Carolina · 2026
 </div>
 
</footer>
 
 
</main>
 
 
 
<!-- =======================================================
    CONTENT DATA
 
    ALL EDITABLE NON-HERO TEXT IS IN content.js
    ======================================================= -->
 
<script src="content.js"></script>
 
 
 
<script>
 
/* =========================================================
  RENDER NON-HERO CONTENT
  ========================================================= */
 
const root =
 document.getElementById("sections");
 
 
sections.forEach(
 (section,index) => {
 
   const sectionElement =
     document.createElement("section");
 
 
   sectionElement.className =
     "section";
 
 
   if(index === 0){
 
     sectionElement.id =
       "about";
 
   }
 
 
   sectionElement.innerHTML = `
 
     <div class="section-title">
 
       <div class="section-mark">
 
         <img
           src="/assets/seito-mon.png"
           alt=""
         >
 
       </div>
 
       <div class="kicker">
         ${section.jpTitle}
       </div>
 
       <div class="sub">
         ${section.enTitle}
       </div>
 
     </div>
 
     <div class="section-body"></div>
 
   `;
 
 
   const body =
     sectionElement.querySelector(
       ".section-body"
     );
 
 
   section.rows.forEach(
     (row,rowIndex) => {
 
       const jp =
         document.createElement("div");
 
 
       jp.className =
         "jp-paragraph";
 
 
       jp.lang =
         "ja";
 
 
       jp.textContent =
         row.jp;
 
 
       const en =
         document.createElement("div");
 
 
       en.className =
         "en-group";
 
 
       row.en.forEach(
         paragraph => {
 
           const node =
             document.createElement("p");
 
 
           if(paragraph.class){
 
             node.className =
               paragraph.class;
 
           }
 
 
           node.textContent =
             paragraph.text;
 
 
           en.appendChild(
             node
           );
 
         }
       );
 
 
       const gridRow =
         rowIndex + 1;
 
 
       jp.style.gridRow =
         gridRow;
 
 
       en.style.gridRow =
         gridRow;
 
 
       body.append(
         jp,
         en
       );
 
     }
   );
 
 
   root.appendChild(
     sectionElement
   );
 
 }
);
 
 
/* =========================================================
  HERO TITLE WIDTH EQUALIZER
  ========================================================= */
 
function equalizeHeroTitle(){
 
 document
   .querySelectorAll(
     "[data-title-equalizer]"
   )
   .forEach(
     group => {
 
       const japanese =
         group.querySelector(
           "[data-title-jp]"
         );
 
 
       const romaji =
         group.querySelector(
           "[data-title-romaji]"
         );
 
 
       if(
         !japanese
         ||
         !romaji
       ){
         return;
       }
 
 
       japanese.style
         .setProperty(
           "--match-extra",
           "0px"
         );
 
 
       romaji.style
         .setProperty(
           "--match-extra",
           "0px"
         );
 
 
       const jpWidth =
         japanese
           .getBoundingClientRect()
           .width;
 
 
       const romajiWidth =
         romaji
           .getBoundingClientRect()
           .width;
 
 
       const targetWidth =
         Math.max(
           jpWidth,
           romajiWidth
         );
 
 
       function expandLine(
         element,
         currentWidth
       ){
 
         if(
           currentWidth >=
           targetWidth - .5
         ){
           return;
         }
 
 
         const characters =
           Array.from(
             element
               .textContent
               .trim()
           ).length;
 
 
         if(
           characters < 2
         ){
           return;
         }
 
 
         const extra =
           (
             targetWidth -
             currentWidth
           )
           /
           (
             characters -
             1
           );
 
 
         element.style
           .setProperty(
             "--match-extra",
             `${extra}px`
           );
 
       }
 
 
       expandLine(
         japanese,
         jpWidth
       );
 
 
       expandLine(
         romaji,
         romajiWidth
       );
 
     }
   );
 
}
 
 
/* =========================================================
  JAPANESE VERTICAL FITTING
  ========================================================= */
 
function paragraphFits(
 paragraph
){
 
 const tolerance =
   1.5;
 
 
 return(
 
   paragraph.scrollWidth <=
     paragraph.clientWidth + tolerance
 
   &&
 
   paragraph.scrollHeight <=
     paragraph.clientHeight + tolerance
 
 );
 
}
 
 
function fitVerticalParagraph(
 paragraph
){
 
 const minimum =
   window.innerWidth >= 760
     ? 220
     : 200;
 
 
 let low =
   minimum;
 
 
 let high =
   minimum;
 
 
 paragraph.style.height =
   `${high}px`;
 
 
 while(
   !paragraphFits(paragraph)
   &&
   high < 1800
 ){
 
   high += 60;
 
 
   paragraph.style.height =
     `${high}px`;
 
 }
 
 
 while(
   low < high
 ){
 
   const middle =
     Math.floor(
       (low + high) / 2
     );
 
 
   paragraph.style.height =
     `${middle}px`;
 
 
   if(
     paragraphFits(paragraph)
   ){
 
     high =
       middle;
 
   }
 
   else{
 
     low =
       middle + 1;
 
   }
 
 }
 
 
 const fontSize =
   parseFloat(
     getComputedStyle(
       paragraph
     ).fontSize
   );
 
 
 const breathingRoom =
   Math.max(
     10,
     fontSize * .55
   );
 
 
 paragraph.style.height =
   `${Math.ceil(
     high + breathingRoom
   )}px`;
 
}
 
 
/* =========================================================
  COMPLETE PAGE LAYOUT
  ========================================================= */
 
function layoutPage(){
 
 equalizeHeroTitle();
 
 
 document
   .querySelectorAll(
     ".jp-paragraph"
   )
   .forEach(
     paragraph => {
 
       fitVerticalParagraph(
         paragraph
       );
 
     }
   );
 
}
 
 
/* =========================================================
  DEBOUNCE
  ========================================================= */
 
function debounce(
 callback,
 delay
){
 
 let timer;
 
 
 return function(){
 
   clearTimeout(
     timer
   );
 
 
   timer =
     setTimeout(
       callback,
       delay
     );
 
 };
 
}
 
 
/* =========================================================
  INITIAL LAYOUT
  ========================================================= */
 
if(
 document.fonts
 &&
 document.fonts.ready
){
 
 document.fonts.ready.then(
   () => {
 
     requestAnimationFrame(
       () => {
 
         requestAnimationFrame(
           layoutPage
         );
 
       }
     );
 
   }
 );
 
}
 
else{
 
 window.addEventListener(
   "load",
   layoutPage
 );
 
}
 
 
/* =========================================================
  RESPONSIVE RECALCULATION
  ========================================================= */
 
const relayout =
 debounce(
   layoutPage,
   120
 );
 
 
window.addEventListener(
 "resize",
 relayout
);
 
 
window.addEventListener(
 "orientationchange",
 () => {
 
   setTimeout(
     layoutPage,
     250
   );
 
 }
);
 
 
if(
 window.visualViewport
){
 
 window.visualViewport
   .addEventListener(
     "resize",
     relayout
   );
 
}
 
</script>
 
 
</body>
</html>
