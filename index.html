<style>

:root {
  --paper:#f3e4d6;
  --folio:#f8efe6;

  --ink:#171411;
  --muted:#6b645d;
  --shu:#b02a20;

  --header-h:82px;

  --reader-max:940px;

  /*
   * MOBILE READING SYSTEM
   */

  --folio-w:100%;

  --jp-size:16.8px;
  --jp-leading:1.66;

  --en-size:18.2px;
  --en-leading:1.44;

  --pair-gap:14px;

  --folio-pad-y:16px;

  --section-pad-x:18px;
}


/* =========================================================
   RESET
   ========================================================= */

* {
  box-sizing:border-box;
}

html {
  scroll-behavior:smooth;
}

body {
  margin:0;

  color:var(--ink);
  background:var(--paper);

  font-family:
    "Bodoni 72",
    "Bodoni 72 Smallcaps",
    "Baskerville",
    "Iowan Old Style",
    "Times New Roman",
    serif;

  line-height:1.48;
}

img {
  display:block;
  max-width:100%;
}


/* =========================================================
   HEADER
   ========================================================= */

.site-header {
  position:sticky;
  top:0;

  z-index:100;

  min-height:var(--header-h);

  display:flex;
  align-items:center;
  justify-content:space-between;

  gap:14px;

  padding:
    10px
    14px
    10px
    max(18px, env(safe-area-inset-left));

  background:var(--paper);

  border-bottom:
    1px solid rgba(0,0,0,.08);

  box-shadow:
    0 4px 14px rgba(0,0,0,.045);

  overflow:hidden;
}

.brand {
  display:flex;
  align-items:center;

  gap:12px;

  min-width:0;

  margin-left:10px;

  color:inherit;
  text-decoration:none;
}

.brand .mon {
  width:58px;

  flex:0 0 auto;
}

.brand-stack {
  min-width:0;
  line-height:1;
}

.brand-stack .jp {
  display:block;

  margin-bottom:4px;

  font-family:
    "Hiragino Mincho ProN",
    "Yu Mincho",
    "YuMincho",
    "Noto Serif JP",
    serif;

  font-weight:700;

  font-size:
    clamp(17px,4.4vw,24px);

  letter-spacing:.03em;
}

.brand-stack .romaji {
  display:block;

  margin-bottom:4px;

  font-size:
    clamp(11px,2.8vw,14px);

  letter-spacing:.12em;
}

.brand-stack .en {
  display:block;

  font-size:
    clamp(12px,3.2vw,18px);

  letter-spacing:.022em;
}

.menu {
  width:44px;
  height:44px;

  flex:0 0 auto;

  border:
    2px solid var(--shu);

  border-radius:2px;

  background:var(--paper);

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:5px;

  cursor:pointer;
}

.menu span {
  width:22px;
  height:3px;

  display:block;

  background:var(--shu);

  border-radius:1px;
}


/* =========================================================
   HERO
   ========================================================= */

main {
  overflow:hidden;
}

.hero {
  min-height:
    calc(100svh - var(--header-h));

  display:grid;

  align-content:center;
  justify-items:center;

  padding:
    34px
    18px
    38px;

  text-align:center;
}

.hero-mon {
  width:
    min(60vw,320px);

  margin-bottom:18px;
}

.hero h1 {
  margin:0;

  font-family:
    "Hiragino Mincho ProN",
    "Yu Mincho",
    "YuMincho",
    "Noto Serif JP",
    serif;

  font-size:
    clamp(40px,11vw,63px);

  line-height:1.04;

  letter-spacing:.02em;
}

.hero .romaji {
  margin-top:12px;

  font-size:
    clamp(20px,5.9vw,32px);

  letter-spacing:.12em;

  line-height:1.07;
}

.hero .english {
  margin-top:10px;

  font-size:
    clamp(28px,7.8vw,40px);

  line-height:1.08;

  letter-spacing:.022em;
}

.ornament {
  display:flex;
  align-items:center;

  gap:12px;

  width:
    min(52vw,290px);

  margin:
    18px auto;
}

.ornament::before,
.ornament::after {
  content:"";

  flex:1;

  height:1px;

  background:
    rgba(176,42,32,.72);
}

.ornament i {
  width:8px;
  height:8px;

  display:block;

  background:var(--shu);

  border-radius:50%;

  box-shadow:
    -9px 0 var(--shu),
     9px 0 var(--shu),
     0 -9px var(--shu);
}

.soryuki {
  line-height:1.22;

  margin-bottom:24px;
}

.soryuki span {
  display:block;
}

.soryuki .jp {
  font-family:
    "Hiragino Mincho ProN",
    "Yu Mincho",
    "YuMincho",
    "Noto Serif JP",
    serif;

  font-size:
    clamp(18px,5.6vw,30px);
}

.soryuki .rom,
.soryuki .en {
  font-size:
    clamp(16px,4.6vw,24px);
}

.soryuki .place {
  margin-top:7px;

  font-size:
    clamp(14px,4.2vw,20px);
}


/* =========================================================
   CONTENT
   ========================================================= */

.section {
  width:
    min(100%,var(--reader-max));

  margin:
    0 auto;

  padding:
    48px
    var(--section-pad-x)
    56px;
}

.section-title {
  text-align:center;

  margin-bottom:28px;
}

.section-title .ornament {
  margin-top:0;
  margin-bottom:14px;
}

.section-title .kicker {
  font-family:
    "Hiragino Mincho ProN",
    "Yu Mincho",
    "YuMincho",
    "Noto Serif JP",
    serif;

  font-size:
    clamp(19px,5vw,29px);

  font-weight:700;

  line-height:1.15;
}

.section-title .sub {
  margin-top:6px;

  font-size:
    clamp(13px,3.6vw,17px);

  font-weight:600;

  letter-spacing:.10em;
}


/* =========================================================
   BILINGUAL PAIR
   ========================================================= */

.pair-row {
  width:100%;

  display:grid;

  grid-template-columns:
    minmax(0,1fr)
    minmax(0,1fr);

  column-gap:
    var(--pair-gap);

  align-items:start;

  margin:
    0
    0
    38px;
}


/* =========================================================
   JAPANESE FOLIO
   ========================================================= */

.jp-card {
  width:
    min(var(--folio-w),100%);

  min-width:0;

  justify-self:end;

  padding:
    var(--folio-pad-y)
    var(--folio-pad-x);

  writing-mode:vertical-rl;
  text-orientation:mixed;

  overflow:hidden;

  font-family:
    "Hiragino Mincho ProN",
    "Yu Mincho",
    "YuMincho",
    "Noto Serif JP",
    serif;

  font-size:
    var(--jp-size);

  line-height:
    var(--jp-leading);

  letter-spacing:.025em;

  background:
    linear-gradient(
      145deg,
      rgba(255,255,255,.34),
      transparent 36%
    ),
    repeating-linear-gradient(
      0deg,
      rgba(85,65,45,.012) 0 1px,
      transparent 1px 4px
    ),
    var(--folio);

  border:
    1px solid rgba(72,52,37,.13);

  border-radius:2px;

  box-shadow:
    inset 0 1px 0 rgba(255,255,255,.50),
    0 1px 2px rgba(74,45,25,.055),
    0 8px 20px rgba(74,45,25,.085);
}

.jp-card p {
  margin:0;
}


/* =========================================================
   ENGLISH
   ========================================================= */

.en-block {
  min-width:0;

  padding-top:
    var(--folio-pad-y);

  font-size:
    var(--en-size);

  font-weight:500;

  line-height:
    var(--en-leading);

  letter-spacing:.002em;

  font-kerning:normal;

  overflow-wrap:anywhere;
}

.en-block p {
  margin:
    0
    0
    1.08em;

  text-align:justify;
  text-align-last:left;

  hyphens:auto;
  -webkit-hyphens:auto;

  word-spacing:.02em;
}

.en-block .sequence {
  font-size:.92em;

  line-height:1.55;

  letter-spacing:.025em;

  text-align:left;
}

.en-block .closing {
  font-size:1.42em;

  line-height:1.13;

  text-align:left;
}


/* =========================================================
   TABLET / DESKTOP
   ========================================================= */

/*
 * LARGE SCREEN RULES
 *
 * Every Japanese folio becomes the same physical page:
 *
 * 17rem wide
 * 25rem tall
 *
 * Japanese grows to 22px.
 * English grows to 21px.
 *
 * The mobile auto-height system is switched off.
 */

@media(min-width:760px) {

  :root {
    --header-h:90px;

    --reader-max:68rem;

    --folio-w:17rem;

    --jp-size:22px;
    --jp-leading:1.68;

    --en-size:21px;
    --en-leading:1.46;

    --pair-gap:30px;

    --folio-pad-x:18px;
    --folio-pad-y:20px;

    --section-pad-x:38px;
  }

  .jp-card {
    width:var(--folio-w);

    height:25rem !important;

    max-width:100%;

    justify-self:end;
  }

}


/* =========================================================
   FOOTER
   ========================================================= */

.colophon {
  text-align:center;

  padding:
    26px
    16px
    78px;

  color:var(--muted);
}

.colophon .mon {
  width:82px;

  margin:
    0
    auto
    10px;
}

.colophon .jp {
  color:var(--ink);

  font-family:
    "Hiragino Mincho ProN",
    "Yu Mincho",
    "YuMincho",
    "Noto Serif JP",
    serif;

  font-size:23px;

  font-weight:700;
}

.colophon .romaji {
  color:var(--ink);

  margin-top:4px;

  font-size:12px;

  letter-spacing:.11em;
}

.colophon .en {
  color:var(--ink);

  margin-top:4px;

  font-size:17px;
}

.colophon .meta {
  margin-top:12px;

  font-size:13px;
}


/* =========================================================
   REDUCED MOTION
   ========================================================= */

@media(prefers-reduced-motion:reduce) {

  html {
    scroll-behavior:auto;
  }

}

</style>
</head>

      "section";

    }

          ${section.jpTitle}
        </div>

    section.rows.forEach(
      row => {

        pair.className =

          document.createElement("div");


        jp.className =
          "jp-card";


        jp.lang =
          "ja";

/* =========================================================
   MOBILE FOLIO FITTING ONLY
   ========================================================= */

/*
 * MOBILE:
 *
 * Folio width is determined by the left 50% column.
 * Height is calculated from the actual Japanese paragraph.
 *
 *
 * TABLET / DESKTOP:
 *
 * CSS takes over completely.
 *
 * Every card is:
 *
 * 17rem × 25rem
 *
 * and this script removes any mobile inline height.
 */


function folioFits(card) {

  return (
    card.scrollWidth <=
      card.clientWidth + 1
    &&
    card.scrollHeight <=
      card.clientHeight + 1
  );

}


function fitMobileFolio(card) {

  let low =
    220;

  let high =
    320;


  card.style.height =
    `${high}px`;


  while(
    !folioFits(card)
    &&
    high < 1800
  ) {

    high += 100;

    card.style.height =
      `${high}px`;

  }


  while(
    low < high
  ) {

    const middle =
      Math.floor(
        (low + high) / 2
      );


    card.style.height =
      `${middle}px`;


    if(
      folioFits(card)
    ) {

      high =
        middle;

    }

    else {

      low =
        middle + 1;

    }

  }


  const fontSize =
    parseFloat(
      getComputedStyle(card)
        .fontSize
    );


  const breathingRoom =
    Math.max(
      16,
      fontSize * 1.15
    );


  card.style.height =
    `${Math.ceil(
      high + breathingRoom
    )}px`;

}


function layoutFolios() {

  const cards =
    document.querySelectorAll(
      ".jp-card"
    );


  /*
   * TABLET / DESKTOP
   */

  if(
    window.innerWidth >= 760
  ) {

    cards.forEach(
      card => {

        /*
         * Remove the mobile inline height.
         *
         * CSS then supplies:
         * height:25rem !important
         */

        card.style.height =
          "";

      }
    );


    return;

  }


  /*
   * MOBILE
   */

  cards.forEach(
    card => {

      fitMobileFolio(
        card
      );

    }
  );

}


/* =========================================================
   RESIZE DEBOUNCE
   ========================================================= */

function debounce(
  callback,
  delay
) {

  let timer;


  return function() {

    clearTimeout(
      timer
    );


    timer =
      setTimeout(
        callback,
        delay
      );

  };

}


/* =========================================================
   INITIAL LAYOUT
   ========================================================= */

if(
  document.fonts
  &&
  document.fonts.ready
) {

  document.fonts.ready.then(
    () => {

      requestAnimationFrame(
        layoutFolios
      );

    }
  );

}

else {

  window.addEventListener(
    "load",
    layoutFolios
  );

}


/* =========================================================
   RESPONSIVE RECALCULATION
   ========================================================= */

window.addEventListener(
  "resize",
  debounce(
    layoutFolios,
    150
  )
);


window.addEventListener(
  "orientationchange",
  () => {

    setTimeout(
      layoutFolios,
      250
    );

  }
);
