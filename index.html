
<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta

<link
  rel="preconnect"

  crossorigin
>

<link
  href="https://fonts.googleapis.com/css2?family=Yuji+Syuku&display=swap"
  rel="stylesheet"
>

>

<body>


<!-- =======================================================
     HEADER
     ======================================================= -->

<header class="site-header">

    class="header-blossom"
    src="/assets/cherry_blossom_header.png"

  >

    <img

      src="/assets/seito-mon.png"
      alt="Seito-ryū mon"
    >

    <div class="brand-stack">

      <span class="jp">
        聖都流合気武道
      </span>

      <span class="romaji">
        SEITO-RYŪ AIKI BUDŌ
      </span>

    </div>

  </a>


  <button
    class="menu"
    type="button"
    aria-label="Go to founding lore"
  >

    <span></span>
    <span></span>
    <span></span>

  </button>

</header>



<!-- =======================================================
     MAIN
     ======================================================= -->

<main id="top">


<!-- =======================================================
     HERO
     ======================================================= -->

<section class="hero">

  <div class="hero-poster">

    <img
      class="hero-mon"
      src="/assets/seito-mon.png"
      alt="Seito-ryū mon"
    >


    <div class="hero-wordmark">

      <div
        class="hero-title-block"
        data-title-equalizer
      >

        <h1 data-title-jp>
          聖都流合気武道
        </h1>


        <div
          class="hero-rule"
          aria-hidden="true"
        ></div>


        <div
          class="romaji"
          data-title-romaji
        >
          SEITO-RYŪ AIKI BUDŌ
        </div>

      </div>


      <div class="hero-mark">

        <img
          src="/assets/seito-mon.png"
          alt=""
          aria-hidden="true"
        >

      </div>

    </div>


    <div class="soryuki">

      <span class="jp">
        創流期
      </span>

      <span class="rom">
        Sōryū-ki
      </span>

      <span class="en">
        Formative Period
      </span>

      <span class="place">
        Charleston, South Carolina · 2026
      </span>

    </div>

  </div>

</section>



<!-- =======================================================
     STORY
     ======================================================= -->

<div id="sections"></div>



<!-- =======================================================
     FOOTER
     ======================================================= -->

<footer class="colophon">

  <img
    class="mon"
    src="/assets/seito-mon.png"
    alt=""
    aria-hidden="true"
  >

  <div class="jp">
    聖都流合気武道
  </div>

  <div class="romaji">
    SEITO-RYŪ AIKI BUDŌ
  </div>

  <div class="meta">
    創流期 — Sōryū-ki — Formative Period
  </div>

  <div class="meta">
    Charleston, South Carolina · 2026
  </div>

</footer>


</main>



<!-- =======================================================
     CONTENT
     ======================================================= -->

<script src="content.js"></script>


<script>

/* =========================================================
   REFERENCES
   ========================================================= */

const root =
  document.getElementById("sections");


const menuButton =
  document.querySelector(".menu");



/* =========================================================
   AIKI SEAL
   ========================================================= */

function createAikiSeal(key){

  const data =
    aikiSeals[key];


  if(!data){
    return null;
  }


  const seal =
    document.createElement("div");


  seal.className =
    "aiki-seal";


  seal.dataset.seal =
    key;


  seal.setAttribute(
    "aria-label",
    `${data.romaji}: ${data.gloss}`
  );


  seal.innerHTML = `

    <span class="aiki-seal-jp">
      ${data.jp}
    </span>

    <span class="aiki-seal-romaji">
      ${data.romaji}
    </span>

    <span class="aiki-seal-gloss">
      ${data.gloss}
    </span>

  `;


  return seal;

}



/* =========================================================
   ENGLISH ENTRY
   ========================================================= */

function createEnglishEntry(paragraph){

  const entry =
    document.createElement("div");


  entry.className =
    "en-entry";


  if(paragraph.seal){

    const seal =
      createAikiSeal(
        paragraph.seal
      );


    if(seal){

      if(
        paragraph.seal ===
        "KAMAE"
      ){

        seal.classList.add(
          "aiki-seal-first"
        );

      }


      entry.appendChild(
        seal
      );

    }

  }


  const p =
    document.createElement("p");


  if(paragraph.class){

    p.className =
      paragraph.class;

  }


  p.textContent =
    paragraph.text;


  entry.appendChild(
    p
  );


  return entry;

}



/* =========================================================
   NORMALIZE JAPANESE TEXT

   Preserve paragraph breaks without forcing folios.
   ========================================================= */

function normalizeJapaneseText(text){

  return String(text || "")

    .trim()

    .replace(
      /\r\n?/g,
      "\n"
    )

    .replace(
      /[ \t]+\n/g,
      "\n"
    )

    .replace(
      /\n[ \t]+/g,
      "\n"
    )

    .replace(
      /\n{2,}/g,
      "\n"
    );

}



/* =========================================================
   JAPANESE BLOCK

   No pagination.
   No folios.
   No JavaScript text measurement.

   Browser-native vertical text flow.
   ========================================================= */

function createJapaneseBlock(text){

  const block =
    document.createElement("div");


  block.className =
    "jp-block";


  block.lang =
    "ja";


  block.textContent =
    normalizeJapaneseText(
      text
    );


  return block;

}



/* =========================================================
   AIKI REVEAL
   ========================================================= */

function createRevealControl(){

  const wrap =
    document.createElement(
      "div"
    );


  wrap.className =
    "aiki-reveal-wrap";


  const button =
    document.createElement(
      "button"
    );


  button.type =
    "button";


  button.className =
    "aiki-reveal-button";


  button.setAttribute(
    "aria-expanded",
    "false"
  );


  button.innerHTML = `

    <span class="aiki-seal-jp">
      合気
    </span>

    <span class="aiki-seal-romaji">
      AIKI
    </span>

    <span class="aiki-seal-gloss">
      TAP TO SEE
    </span>

  `;


  button.addEventListener(
    "click",
    () => {

      if(
        document.body.classList.contains(
          "aiki-imprint-revealed"
        )
      ){
        return;
      }


      document.body.classList.add(
        "aiki-imprint-revealed"
      );


      button.classList.add(
        "is-revealed"
      );


      button.setAttribute(
        "aria-expanded",
        "true"
      );


      const firstSeal =
        document.querySelector(
          ".aiki-seal-first"
        );


      if(!firstSeal){
        return;
      }


      const reducedMotion =
        window.matchMedia(
          "(prefers-reduced-motion: reduce)"
        ).matches;


      requestAnimationFrame(
        () => {

          firstSeal.scrollIntoView({

            behavior:
              reducedMotion
                ? "auto"
                : "smooth",

            block:
              "start"

          });

        }
      );

    }
  );


  wrap.appendChild(
    button
  );


  return wrap;

}



/* =========================================================
   RENDER STORY
   ========================================================= */

function renderSections(){

  if(
    !root
    ||
    !Array.isArray(sections)
  ){
    return;
  }


  const fragment =
    document.createDocumentFragment();


  sections.forEach(
    (section,index) => {

      const sectionElement =
        document.createElement(
          "section"
        );


      sectionElement.className =
        "section";


      if(index === 0){

        sectionElement.id =
          "about";

      }


      /* ---------------------------------------------------
         SECTION TITLE
         --------------------------------------------------- */

      const title =
        document.createElement(
          "header"
        );


      title.className =
        "section-title";


      title.innerHTML = `

        <div class="section-mark">

          <img
            src="/assets/seito-mon.png"
            alt=""
            aria-hidden="true"
          >

        </div>

        <div class="kicker">
          ${section.jpTitle}
        </div>

        <div class="sub">
          ${section.enTitle}
        </div>

      `;


      /* ---------------------------------------------------
         BILINGUAL FIELD
         --------------------------------------------------- */

      const bilingual =
        document.createElement(
          "div"
        );


      bilingual.className =
        "bilingual-block";


      /* ---------------------------------------------------
         JAPANESE
         --------------------------------------------------- */

      const japanese =
        createJapaneseBlock(
          section.jp
        );


      /* ---------------------------------------------------
         ENGLISH
         --------------------------------------------------- */

      const english =
        document.createElement(
          "div"
        );


      english.className =
        "en-block";


      section.en.forEach(
        paragraph => {

          english.appendChild(
            createEnglishEntry(
              paragraph
            )
          );

        }
      );


      /* ---------------------------------------------------
         FINAL REVEAL
         --------------------------------------------------- */

      if(
        section.revealAikiImprint
      ){

        english.appendChild(
          createRevealControl()
        );

      }


      bilingual.append(
        japanese,
        english
      );


      sectionElement.append(
        title,
        bilingual
      );


      fragment.appendChild(
        sectionElement
      );

    }
  );


  root.replaceChildren(
    fragment
  );

}



/* =========================================================
   HEADER BUTTON
   ========================================================= */

menuButton?.addEventListener(
  "click",
  () => {

    document
      .getElementById("about")
      ?.scrollIntoView({

        behavior:
          window.matchMedia(
            "(prefers-reduced-motion: reduce)"
          ).matches
            ? "auto"
            : "smooth",

        block:
          "start"

      });

  }
);



/* =========================================================
   HERO TITLE WIDTH EQUALIZER
   ========================================================= */

function equalizeHeroTitle(){

  document
    .querySelectorAll(
      "[data-title-equalizer]"
    )
    .forEach(
      group => {

        const japanese =
          group.querySelector(
            "[data-title-jp]"
          );


        const romaji =
          group.querySelector(
            "[data-title-romaji]"
          );


        if(
          !japanese
          ||
          !romaji
        ){
          return;
        }


        japanese.style
          .setProperty(
            "--match-extra",
            "0px"
          );


        romaji.style
          .setProperty(
            "--match-extra",
            "0px"
          );


        const jpWidth =
          japanese
            .getBoundingClientRect()
            .width;


        const romajiWidth =
          romaji
            .getBoundingClientRect()
            .width;


        const targetWidth =
          Math.max(
            jpWidth,
            romajiWidth
          );


        function expandLine(
          element,
          currentWidth
        ){

          if(
            currentWidth >=
            targetWidth - .5
          ){
            return;
          }


          const characters =
            Array.from(
              element
                .textContent
                .trim()
            ).length;


          if(
            characters < 2
          ){
            return;
          }


          const extra =
            (
              targetWidth -
              currentWidth
            )
            /
            (
              characters -
              1
            );


          element.style
            .setProperty(
              "--match-extra",
              `${extra}px`
            );

        }


        expandLine(
          japanese,
          jpWidth
        );


        expandLine(
          romaji,
          romajiWidth
        );

      }
    );

}



/* =========================================================
   INITIALIZE
   ========================================================= */

renderSections();


if(
  document.fonts
  &&
  document.fonts.ready
){

  document.fonts.ready.then(
    () => {

      requestAnimationFrame(
        equalizeHeroTitle
      );

    }
  );

}

else{

  window.addEventListener(
    "load",
    equalizeHeroTitle,
    { once:true }
  );

}


window.addEventListener(
  "resize",
  equalizeHeroTitle
);

</script>


</body>

</html>
