<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Suenaka-kei Tetsugaku-hō Aikidō continues the study of Roy Yukio Suenaka’s aikidō teachings. The Suenaka-kei Yūdanshakai is its governing association in formation in Charleston, South Carolina.">
  <title>Suenaka-kei Tetsugaku-hō Aikidō</title>

  <style>
    :root {
      --indigo: #192d43;
      --indigo-dark: #111e2e;
      --indigo-soft: #526579;
      --ivory: #f8f6f0;
      --paper: #f0ede5;
      --white: #fffefa;
      --ink: #252b32;
      --muted: #626c76;
      --red: #ad4439;
      --line: #dcd8ce;
      --serif: Georgia, "Times New Roman", serif;
      --sans: -apple-system, BlinkMacSystemFont, "Segoe UI", Arial, sans-serif;
      --jp: "Hiragino Mincho ProN", "Yu Mincho", "Noto Serif CJK JP", serif;
    }

    *, *::before, *::after {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
      scroll-padding-top: 112px;
    }

    body {
      margin: 0;
      background: var(--ivory);
      color: var(--ink);
      font: 16px/1.8 var(--sans);
    }

    a {
      color: inherit;
      text-underline-offset: .2em;
    }

    a:focus-visible {
      outline: 2px solid var(--red);
      outline-offset: 4px;
    }

    .container {
      width: min(calc(100% - 48px), 1080px);
      margin-inline: auto;
    }

    .skip-link {
      position: fixed;
      top: 12px;
      left: 16px;
      z-index: 30;
      padding: 10px 16px;
      background: var(--white);
      transform: translateY(-150%);
    }

    .skip-link:focus {
      transform: none;
    }

    .site-header {
      position: sticky;
      top: 0;
      z-index: 20;
      background: rgba(248, 246, 240, .97);
      border-bottom: 1px solid var(--line);
    }

    .header-inner {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 24px;
      min-height: 90px;
    }

    .brand {
      flex-shrink: 0;
      color: var(--indigo);
      text-decoration: none;
      line-height: 1.35;
    }

    .brand-jp, .footer-jp {
      display: block;
      font: 600 23px/1.4 var(--jp);
      letter-spacing: .07em;
    }

    .brand-en {
      display: block;
      margin-top: 5px;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .12em;
      text-transform: uppercase;
    }

    .main-nav {
      display: flex;
      flex-wrap: wrap;
      justify-content: flex-end;
      gap: 8px 16px;
    }

    .main-nav a {
      color: var(--indigo);
      font-size: 11px;
      font-weight: 650;
      text-decoration: none;
      white-space: nowrap;
    }

    .main-nav a:hover, .references a:hover {
      color: var(--red);
    }

    .hero {
      background:
        radial-gradient(circle at 78% 50%, rgba(115, 138, 161, .15), transparent 45%),
        linear-gradient(125deg, #15283d, #0e1a2a);
      color: var(--ivory);
    }

    .hero-inner {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 240px;
      align-items: center;
      gap: 40px;
      min-height: 540px;
      padding-block: 90px;
    }

    .eyebrow, .kicker, .label {
      margin: 0 0 12px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: .17em;
      text-transform: uppercase;
    }

    .eyebrow {
      margin-bottom: 20px;
      color: #c6bdaf;
    }

    h1 {
      margin: 0;
      font: 500 clamp(32px, 5vw, 58px)/1.4 var(--jp);
      letter-spacing: .06em;
    }

    .hero-roman {
      margin-top: 14px;
      font: clamp(23px, 3vw, 34px)/1.35 var(--serif);
    }

    .hero-translation {
      margin-top: 10px;
      color: #bbc7d0;
      font-size: 11px
